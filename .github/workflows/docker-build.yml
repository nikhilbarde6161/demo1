name: docker-pipeline

on: 
  push: 
    branches: [ "main" ]
  workflow_dispatch: 

jobs:
  ci-job:
    runs-on: ubuntu-latest
    steps:
      
      - name: copy code to github
        uses: actions/checkout@v4
      - name: docker login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: build docker image
        run: docker build -t nikhilbarde6161/githubdemo:latest .
      - name: docker push
        run: docker push nikhilbarde6161/githubdemo:latest 
        with:
          name: website-file
          path: |
            index.html
