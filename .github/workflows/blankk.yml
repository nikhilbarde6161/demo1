name: Print workspace info

on:
  push:
  workflow_dispatch:

jobs:
  print-info:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Print current directory
        run: pwd

      - name: List files
        run: ls -la

      - name: Print current date
        run: date
